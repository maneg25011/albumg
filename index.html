<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album · responsive thumbnails</title>
  <style>
    /* ----- CSS variables for theming ----- */
    :root {
      --bg-body: #f5f7fa;
      --bg-header: #ffffff;
      --bg-btn: #f1f5f9;
      --bg-btn-hover: #e2e8f0;
      --bg-card: #ffffff;
      --bg-card-border: rgba(0, 0, 0, 0.02);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --bg-muted-pill: #eef2f6;
      --shadow-header: 0 8px 20px rgba(0, 0, 0, 0.05);
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.04);
      --shadow-card-hover: 0 12px 24px rgba(0, 0, 0, 0.08);
      --nav-bg: #eef2f6;
      --nav-active: #ffffff;
      --nav-hover: #e2e8f0;
    }

    /* ----- night theme overrides ----- */
    body.night {
      --bg-body: #0b0f17;
      --bg-header: #151c28;
      --bg-btn: #1e293b;
      --bg-btn-hover: #2a3648;
      --bg-card: #151c28;
      --bg-card-border: rgba(255, 255, 255, 0.04);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --bg-muted-pill: #1e293b;
      --shadow-header: 0 8px 20px rgba(0, 0, 0, 0.4);
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-card-hover: 0 12px 24px rgba(0, 0, 0, 0.5);
      --nav-bg: #1e293b;
      --nav-active: #2a3648;
      --nav-hover: #334155;
    }

    /* ----- base / reset ----- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      background-color: var(--bg-body);
      transition: background-color 0.25s ease;
      scroll-behavior: smooth;
    }
    body {
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* ----- layout: sidebar + main content ----- */
    .app-layout {
      display: flex;
      width: 100%;
      max-width: 1400px;
      gap: 2rem;
      align-items: flex-start;
    }

    /* ----- left sidebar with year navigation ----- */
    .sidebar {
      flex: 0 0 180px;
      align-self:auto;
      position: sticky;
      top: 2rem;
      background: var(--bg-header);
      border-radius: 2rem;
      padding: 1.5rem 0.8rem;
      box-shadow: var(--shadow-header);
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
    }
    .sidebar .year-nav {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: transparent;
      padding: 0;
      margin: 0;
    }
    .sidebar .year-nav a {
      display: block;
      padding: 0.65rem 1.2rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      color: var(--text-muted);
      background: transparent;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
      text-align: left;
    }
    .sidebar .year-nav a:hover {
      background: var(--nav-hover);
      color: var(--text-main);
      transform: scale(1.02);
    }
    .sidebar .year-nav a.active {
      background: var(--nav-active);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* ----- main content column ----- */
    .main-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ----- header ----- */
    .header {
      background: var(--bg-header);
      width: 100%;
      padding: 1.2rem 1.5rem 0.8rem;
      border-radius: 2rem;
      box-shadow: var(--shadow-header);
      margin-bottom: 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
    }
    .header h1 {
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-main);
      transition: color 0.25s ease;
    }
    .header .subtitle {
      color: var(--text-muted);
      font-weight: 400;
      background: var(--bg-muted-pill);
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      font-size: 1rem;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* ----- year section ----- */
    .year-section {
      text-align: center;
      width: 100%;
      margin-bottom: 2.5rem;
      scroll-margin-top: 1.5rem;
    }
    .year-section h2 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--bg-muted-pill);
      transition: border-color 0.25s ease, color 0.25s ease;
    }

    /* ----- photo grid (thumbnails) — fixed at 4 columns ----- */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      width: 100%;
    }

    /* each thumbnail card */
    .thumb-card {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 1.2rem;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease,
                  background-color 0.25s ease, border-color 0.25s ease;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-card:hover {
      transform: scale(1.02);
      box-shadow: var(--shadow-card-hover);
    }
    .thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s;
    }

    .footer {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 1rem 0 2rem;
    }

    /* ----- night toggle button ----- */
    .night-btn {
      background: var(--bg-btn);
      border: 1px solid transparent;
      padding: 0.5rem 1.4rem;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .night-btn:hover {
      background: var(--bg-btn-hover);
      transform: scale(1.03);
    }

    /* ----- lightbox overlay ----- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 25, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      z-index: 1000;
      padding: 1.5rem;
    }
    .lightbox.show {
      visibility: visible;
      opacity: 1;
    }
    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f17;
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      transform: scale(0.96);
      transition: transform 0.2s ease;
    }
    .lightbox.show .lightbox-content {
      transform: scale(1);
    }
    .lightbox-content img {
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 1rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      background: #1e1e2a;
    }

    /* ----- lightbox navigation buttons ----- */
    .lightbox-prev,
    .lightbox-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.2rem;
      color: white;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 3.2rem;
      height: 3.2rem;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      z-index: 1005;
      user-select: none;
      backdrop-filter: blur(4px);
    }
    .lightbox-prev {
      left: 1.5rem;
    }
    .lightbox-next {
      right: 1.5rem;
    }
    .lightbox-prev:hover,
    .lightbox-next:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-50%) scale(1.08);
    }
    .lightbox-prev:active,
    .lightbox-next:active {
      transform: translateY(-50%) scale(0.96);
    }

    .lightbox-close {
      position: fixed;
      top: 1.5rem;
      right: 2rem;
      font-size: 2.5rem;
      line-height: 1;
      color: white;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      width: 3rem;
      height: 3rem;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 1005;
      font-weight: 300;
    }
    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.1);
    }

    /* ----- responsive breakpoints (grid columns & sidebar) ----- */
    @media (max-width: 900px) {
      .app-layout {
        flex-direction: column;
      }
      .sidebar {
        position: static;
        flex: auto;
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 2rem;
      }
      .sidebar .year-nav {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.4rem;
      }
      .sidebar .year-nav a {
        padding: 0.45rem 1rem;
        font-size: 0.95rem;
      }
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .lightbox-prev,
      .lightbox-next {
        width: 2.6rem;
        height: 2.6rem;
        font-size: 1.8rem;
      }
      .lightbox-prev {
        left: 0.8rem;
      }
      .lightbox-next {
        right: 0.8rem;
      }
    }
    @media (max-width: 640px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .header h1 {
        font-size: 1.8rem;
      }
      .year-section h2 {
        font-size: 1.4rem;
      }
    }
    @media (max-width: 400px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Left sidebar with year navigation (scrolls to sections) -->
    <aside class="sidebar">
      <nav class="year-nav" aria-label="Album years">
        <a href="#year-2012" class="active">2012</a>
        <a href="#year-2013">2013</a>
        <a href="#year-2014">2014</a>
        <a href="#year-2015">2015</a>
        <a href="#year-2016">2016</a>
      </nav>
      
      <div class="footer">
        <button class="night-btn" id="nightToggle" title="Toggle night mode">🌙 Night</button>
      </div>
    </aside>

    <!-- Main content: header + grouped gallery -->
    <main class="main-content">
      <div class="header" id="myHeader">
        <h1>Album</h1>
      </div>

      <!-- 2012 section -->
      <section class="year-section" id="year-2012">
        <h2>2012</h2>
        <div class="gallery-grid">
          <div class="thumb-card">
            <img src="media/2012-09-08 12.56.41.jpg" alt="2012 photo 1" loading="lazy">
          </div>
          <div class="thumb-card">
            <img src="media/2012-04-06 17.38.49.jpg" alt="2012 photo 2" loading="lazy">
          </div>
          <div class="thumb-card">
            <img src="media/2012-04-06 17.37.46.jpg" alt="2012 photo 3" loading="lazy">
          </div>
          <div class="thumb-card">
            <img src="media/2012-04-06 17.38.28.jpg" alt="2012 photo 4" loading="lazy">
          </div>
          <div class="thumb-card">
            <img src="media/2012-09-01 19.49.48.jpg" alt="2012 photo 5" loading="lazy">
          </div>
        </div>
      </section>

      <!-- 2013 section -->
      <section class="year-section" id="year-2013">
        <h2>2013</h2>
        <div class="gallery-grid">
          <div class="thumb-card">
            <img src="media/2013-01-08 13.51.03.jpg" alt="2013 photo 1" loading="lazy">
          </div>
          <div class="thumb-card">
            <img src="media/2013-01-13 07.50.21.jpg" alt="2013 photo 2" loading="lazy">
          </div>
          <div class="thumb-card">
            <img src="media/2013-08-09 21.04.47.jpg" alt="2013 photo 3" loading="lazy">
          </div>
        </div>
      </section>

      <!-- 2014 section (empty for now) -->
      <section class="year-section" id="year-2014">
        <h2>2014</h2>
        <div class="gallery-grid">
          <!-- No photos yet -->
        </div>
      </section>

      <!-- 2015 section (empty for now) -->
      <section class="year-section" id="year-2015">
        <h2>2015</h2>
        <div class="gallery-grid">
          <!-- No photos yet -->
        </div>
      </section>

      <!-- 2016 section (empty for now) -->
      <section class="year-section" id="year-2016">
        <h2>2016</h2>
        <div class="gallery-grid">
          <!-- No photos yet -->
        </div>
      </section>

    </main>
  </div>

  <!-- Lightbox overlay (hidden by default) -->
  <div class="lightbox" id="lightbox">
    <!-- Navigation buttons -->
    <div class="lightbox-prev" id="lightboxPrev" aria-label="Previous image">‹</div>
    <div class="lightbox-next" id="lightboxNext" aria-label="Next image">›</div>
    <div class="lightbox-close" id="lightboxClose">&times;</div>
    <div class="lightbox-content">
      <img id="lightboxImage" src="" alt="Enlarged photo">
    </div>
  </div>

  <script>
    (function() {
      // ----- DOM elements -----
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxClose = document.getElementById('lightboxClose');
      const lightboxPrev = document.getElementById('lightboxPrev');
      const lightboxNext = document.getElementById('lightboxNext');
      const nightToggle = document.getElementById('nightToggle');

      // ----- Night mode -----
      const NIGHT_KEY = 'album-night-mode';

      function setNightMode(on) {
        document.body.classList.toggle('night', on);
        nightToggle.textContent = on ? '☀️ Day' : '🌙 Night';
        nightToggle.setAttribute('title', on ? 'Switch to day mode' : 'Switch to night mode');
        try {
          localStorage.setItem(NIGHT_KEY, on ? '1' : '0');
        } catch (e) { /* localStorage may be unavailable */ }
      }

      // Load saved preference
      let saved = null;
      try {
        saved = localStorage.getItem(NIGHT_KEY);
      } catch (e) { /* ignore */ }

      if (saved === '1') {
        setNightMode(true);
      } else if (saved === '0') {
        setNightMode(false);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        setNightMode(true);
      }

      nightToggle.addEventListener('click', function() {
        const isNight = document.body.classList.contains('night');
        setNightMode(!isNight);
      });

      // ----- Lightbox functionality with navigation -----
      // Collect all thumb cards across all year sections (in DOM order)
      const thumbCards = Array.from(document.querySelectorAll('.thumb-card'));
      // Build gallery items for the carousel
      const galleryItems = thumbCards.map(card => {
        const img = card.querySelector('img');
        return {
          src: img.getAttribute('src'),
          alt: img.getAttribute('alt') || 'Enlarged photo'
        };
      });

      let currentIndex = 0;

      function openLightbox(index) {
        if (index < 0) index = galleryItems.length - 1;
        if (index >= galleryItems.length) index = 0;
        currentIndex = index;
        const item = galleryItems[currentIndex];
        lightboxImage.setAttribute('src', item.src);
        lightboxImage.setAttribute('alt', item.alt);
        lightbox.classList.add('show');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('show');
        document.body.style.overflow = '';
      }

      function navigatePrev() {
        openLightbox(currentIndex - 1);
      }
      function navigateNext() {
        openLightbox(currentIndex + 1);
      }

      // Attach click listeners to all thumbnail cards
      thumbCards.forEach((card, idx) => {
        card.addEventListener('click', function(e) {
          e.stopPropagation();
          openLightbox(idx);
        });
      });

      // Lightbox controls
      lightboxClose.addEventListener('click', function(e) {
        e.stopPropagation();
        closeLightbox();
      });

      lightboxPrev.addEventListener('click', function(e) {
        e.stopPropagation();
        navigatePrev();
      });

      lightboxNext.addEventListener('click', function(e) {
        e.stopPropagation();
        navigateNext();
      });

      // Close when clicking on the background overlay
      lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) {
          closeLightbox();
        }
      });

      // Keyboard support
      document.addEventListener('keydown', function(e) {
        if (!lightbox.classList.contains('show')) return;
        if (e.key === 'Escape') {
          closeLightbox();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          navigatePrev();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          navigateNext();
        }
      });

      // ----- Year navigation: highlight active section on scroll (optional) -----
      const yearLinks = document.querySelectorAll('.sidebar .year-nav a');
      const sections = document.querySelectorAll('.year-section');

      function updateActiveLink() {
        let currentId = '';
        const scrollPos = window.scrollY + 100; // offset for header
        sections.forEach(section => {
          const sectionTop = section.offsetTop;
          const sectionBottom = sectionTop + section.offsetHeight;
          if (scrollPos >= sectionTop && scrollPos < sectionBottom) {
            currentId = section.getAttribute('id');
          }
        });
        yearLinks.forEach(link => {
          link.classList.remove('active');
          if (link.getAttribute('href') === '#' + currentId) {
            link.classList.add('active');
          }
        });
        // If no section is active, default to first
        if (!currentId && sections.length > 0) {
          yearLinks[0].classList.add('active');
        }
      }

      window.addEventListener('scroll', updateActiveLink);
      window.addEventListener('load', updateActiveLink);

      // Smooth scroll is handled by CSS scroll-behavior: smooth on html
    })();
  </script>
</body>
</html>
